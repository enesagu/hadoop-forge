version: 2
updates:
  # Maven dependencies for the WordCount example. hadoop-client is 'provided'
  # and must stay pinned to the cluster's version, so major bumps are ignored.
  - package-ecosystem: maven
    directory: /examples/wordcount
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: org.apache.hadoop:hadoop-client
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # Hadoop 3.3.6 supports JDK 8 and 11 only. A major bump of the base image
      # to a newer JDK does not "update a dependency" — it produces a cluster
      # that will not start, so those bumps are decided by hand alongside a
      # Hadoop upgrade.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
