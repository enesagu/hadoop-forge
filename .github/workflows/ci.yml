name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run; no point building an old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HADOOP_VERSION: "3.3.6"

jobs:
  # ------------------------------------------------------------------------
  # Cheap gates first: seconds, no Docker, no Java.
  # ------------------------------------------------------------------------
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validate configuration sets
        # Well-formed XML, no duplicate properties, memory settings that can
        # actually be allocated, replication that matches the topology.
        run: bash tests/validate-configs.sh

      - name: Validate Compose files
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.single.yml config -q
          docker compose -f docker/docker-compose.yml \
                         -f monitoring/docker-compose.monitoring.yml config -q

      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/rules:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            check rules /rules/alerts.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Errors (blocking)
        run: |
          shellcheck --severity=error --external-sources \
            scripts/*.sh scripts/lib/*.sh docker/*.sh \
            conf/cluster/*.sh examples/*.sh tests/*.sh

      - name: Warnings (advisory)
        # Advisory so a style opinion cannot block a correctness fix. Read the
        # output; the errors gate above is what must stay green.
        continue-on-error: true
        run: |
          shellcheck --severity=warning --external-sources \
            scripts/*.sh scripts/lib/*.sh docker/*.sh \
            conf/cluster/*.sh examples/*.sh tests/*.sh

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          # DL3008: apt packages are unpinned on purpose — this image tracks
          # security updates in the base rather than freezing a snapshot.
          ignore: DL3008
          failure-threshold: error

  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only relative links. External URLs go stale for reasons
          # that have nothing to do with this repository, and a link checker
          # that fails on someone else's outage gets ignored.
          args: --offline --no-progress --verbose './**/*.md'
          fail: true

  # ------------------------------------------------------------------------
  # The example jar, with its unit tests.
  # ------------------------------------------------------------------------
  example:
    name: WordCount example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build and test
        working-directory: examples/wordcount
        run: mvn -B --no-transfer-progress verify

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: wordcount-jar
          path: examples/wordcount/target/wordcount-1.0.0.jar
          retention-days: 7

  # ------------------------------------------------------------------------
  # The one that actually matters: does a real cluster come up and run a job?
  # ------------------------------------------------------------------------
  cluster:
    name: Cluster smoke test (${{ matrix.topology }})
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: single
            file: docker/docker-compose.single.yml
          - topology: cluster
            file: docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            HADOOP_VERSION=${{ env.HADOOP_VERSION }}
          tags: hadoop-forge:${{ env.HADOOP_VERSION }}
          # Shared across both matrix legs and across runs, so only the first
          # build pays for the 700 MB distribution download.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Start the cluster
        run: docker compose -f ${{ matrix.file }} up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 72); do
            nn=$(docker inspect --format '{{.State.Health.Status}}' \
                   "forge${{ matrix.topology == 'single' && '-single' || '' }}-namenode" 2>/dev/null || echo starting)
            rm=$(docker inspect --format '{{.State.Health.Status}}' \
                   "forge${{ matrix.topology == 'single' && '-single' || '' }}-resourcemanager" 2>/dev/null || echo starting)
            echo "attempt $i: namenode=$nn resourcemanager=$rm"
            if [ "$nn" = healthy ] && [ "$rm" = healthy ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Cluster did not become healthy within 12 minutes"
          exit 1

      - name: Report cluster state
        run: |
          docker compose -f ${{ matrix.file }} ps
          docker compose -f ${{ matrix.file }} exec -T namenode hdfs dfsadmin -report
          docker compose -f ${{ matrix.file }} exec -T resourcemanager yarn node -list

      - name: Health check
        run: docker compose -f ${{ matrix.file }} exec -T gateway bash -s < scripts/health-check.sh

      - name: Smoke test — HDFS round trip and a real MapReduce job
        run: docker compose -f ${{ matrix.file }} exec -T gateway bash -s < scripts/smoke-test.sh

      - name: HDFS command tour
        run: docker compose -f ${{ matrix.file }} exec -T gateway bash /examples/hdfs-basics.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f ${{ matrix.file }} logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f ${{ matrix.file }} down -v
