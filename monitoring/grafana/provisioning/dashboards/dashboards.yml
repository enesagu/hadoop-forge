apiVersion: 1

providers:
  - name: hadoop-forge
    orgId: 1
    folder: Hadoop
    type: file
    disableDeletion: false
    # Re-read the directory periodically, so editing the JSON on disk is enough.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
